services:

  mysql:
    image: mysql:8.0
    container_name: expense-tracker-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Root@12345
      MYSQL_DATABASE: expense_tracker
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: expense-tracker-backend:latest
    container_name: expense-tracker-backend
    ports:
      - "8091:8091"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/expense_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Root@12345
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: expense-tracker-frontend:latest
    container_name: expense-tracker-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data: